<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyek Valak330</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e8ecff;
      background: linear-gradient(135deg, #0f172a, #1e1b4b 50%, #312e81);
      background-attachment: fixed;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 2rem 1rem 3rem; }
    header { text-align: center; margin-bottom: 2rem; }
    header img {
      width: 110px; height: 110px; border-radius: 50%;
      border: 3px solid #818cf8;
      box-shadow: 0 0 25px rgba(129, 140, 248, .6);
    }
    h1 {
      margin: .8rem 0 .2rem; font-size: 2rem;
      background: linear-gradient(90deg, #a5b4fc, #f0abfc);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
    }
    header p { margin: 0; color: #a5b4fc; }
    #count {
      display: inline-block; margin-top: .6rem; padding: 4px 12px;
      border-radius: 999px; background: rgba(255,255,255,.1); font-size: .85rem;
    }
    #list { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .repo {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px; padding: 16px;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      display: flex; flex-direction: column;
    }
    .repo:hover {
      transform: translateY(-5px);
      border-color: #818cf8;
      box-shadow: 0 10px 25px rgba(0,0,0,.4);
    }
    .repo h3 { margin: 0 0 6px; font-size: 1.1rem; word-break: break-word; }
    .repo p { margin: 0 0 12px; color: #c7cdf5; font-size: .9rem; flex: 1; }
    .meta { font-size: .78rem; color: #94a3d8; margin-bottom: 12px; }
    .btns { display: flex; gap: 8px; }
    .btn {
      padding: 7px 12px; border-radius: 8px; font-size: .85rem;
      text-decoration: none; color: #fff;
      border: 1px solid rgba(255,255,255,.25);
    }
    .btn.web { background: linear-gradient(90deg, #6366f1, #a855f7); border: none; }
    .btn:hover { opacity: .85; }
    footer { text-align: center; margin-top: 2.5rem; color: #7c86c9; font-size: .8rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="https://github.com/Valak330.png" alt="Foto profil">
      <h1>Valak330</h1>
      <p>Kumpulan proyek dan karya saya</p>
      <span id="count">Memuat...</span>
    </header>

    <div id="list"></div>

    <footer>Daftar ini diperbarui otomatis dari GitHub</footer>
  </div>

  <script>
    var USER = "Valak330";
    var countEl = document.getElementById("count");
    var listEl = document.getElementById("list");

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      return e;
    }

    fetch("https://api.github.com/users/" + USER + "/repos?per_page=100&sort=updated")
      .then(function (r) { return r.json(); })
      .then(function (repos) {
        if (!Array.isArray(repos)) {
          countEl.textContent = "Gagal: " + (repos.message || "respon tidak dikenal");
          return;
        }
        var items = repos.filter(function (r) {
          return !r.fork && r.name.toLowerCase() !== USER.toLowerCase() + ".github.io";
        });
        countEl.textContent = items.length + " proyek";

        items.forEach(function (r) {
          var web = "https://" + USER.toLowerCase() + ".github.io/" + r.name + "/";
          var tgl = new Date(r.pushed_at).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });

          var card = el("div", "repo");
          card.appendChild(el("h3", "", r.name.replace(/[-_]/g, " ")));
          card.appendChild(el("p", "", r.description || "Belum ada deskripsi."));
          card.appendChild(el("div", "meta", (r.language ? r.language + " · " : "") + "Diperbarui " + tgl));

          var btns = el("div", "btns");
          if (r.has_pages) {
            var a1 = el("a", "btn web", "Buka web");
            a1.href = web;
            btns.appendChild(a1);
          }
          var a2 = el("a", "btn", "Kode");
          a2.href = r.html_url;
          btns.appendChild(a2);

          card.appendChild(btns);
          listEl.appendChild(card);
        });
      })
      .catch(function (err) {
        countEl.textContent = "Error: " + err.message;
      });
  </script>
</body>
</html>
